spring.application.name=cinema

# Load local environment values when running from the backend directory.
# The file is ignored by git; copy backend/.env.example to backend/.env.
spring.config.import=optional:file:.env[.properties]

# PostgreSQL Database Configuration
# For Supabase, set these environment variables before running:
# DATABASE_URL=jdbc:postgresql://db.PROJECT_REF.supabase.co:5432/postgres?sslmode=require
# DB_USERNAME=postgres
# DB_PASSWORD=your_supabase_database_password
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/cinema_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# JPA/Hibernate Properties
# Update to update schema automatically, create-drop for recreating every run
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# API Server Port
server.port=8081
